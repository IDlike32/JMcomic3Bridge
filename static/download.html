<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f13">
<meta name="color-scheme" content="dark light">
<title>正在打包 ZIP · JMBridge</title>
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/app.css">
<style>
  .dl-page { min-height: 100%; display: grid; place-items: center; padding: 24px calc(16px + var(--safe-r)) 24px calc(16px + var(--safe-l)); }
  .dl-card { width: min(460px, 100%); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 22px; box-shadow: var(--shadow-2); }
  .dl-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .dl-mark { width: 42px; height: 42px; border-radius: var(--radius-sm); display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-text); flex: none; }
  .dl-spinner { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--surface-3); border-top-color: var(--accent); animation: dl-spin .9s linear infinite; }
  @keyframes dl-spin { to { transform: rotate(360deg); } }
  .dl-mark.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
  .dl-mark.bad { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
  .dl-mark.ok::after { content: "✓"; font-size: 19px; font-weight: 700; }
  .dl-mark.bad::after { content: "!"; font-size: 19px; font-weight: 700; }
  .dl-title { font-size: 15px; font-weight: 650; }
  .dl-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .dl-stats { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 10px; }
  .dl-error { margin-top: 10px; font-size: 12px; color: var(--bad); word-break: break-word; }
  .dl-actions { display: flex; gap: 10px; margin-top: 16px; }
  .dl-actions .btn { flex: 1; }
  .dl-hint { margin-top: 12px; font-size: 11.5px; color: var(--muted); text-align: center; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<main class="dl-page" id="page"></main>
<script type="module" src="/js/download.js"></script>
</body>
</html>
